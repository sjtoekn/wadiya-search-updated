<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — Wadiya</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="login"><h1>Sign in</h1>
<form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" maxlength="254" required>
<label>Password</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required>
<button type="submit">Sign in</button><p id="msg" class="status error" role="alert"></p></form>
<p style="margin:16px 0;text-align:center">or</p><p><a href="/api/auth/google/login">Continue with Google</a></p><p>New to Wadiya? <a href="/register">Create an account</a></p></main>
<script src="/static/auth.js"></script></body></html>
