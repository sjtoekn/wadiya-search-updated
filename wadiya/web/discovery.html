<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Website Discovery – Wadiya.com</title>
  <meta name="description" content="Discover what Wadiya knows about a website.">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="discovery">
  <header class="top">
    <a class="mark" href="/" id="markLink" aria-label="Wadiya.com home">wadiya<span>.com</span></a>
    <form id="searchForm" class="box" role="search" autocomplete="off">
      <input id="q" name="q" type="search" maxlength="200" placeholder="What do you want to discover?" aria-label="Search query">
      <button type="submit">Discover</button>
    </form>
  </header>

  <main class="discovery-main">
    <div id="status" class="status" role="status" aria-live="polite">Discovering website…</div>

    <section class="website-submit" aria-labelledby="website-submit-title">
      <div class="website-submit-copy">
        <p class="discovery-kicker">SUBMIT A WEBSITE</p>
        <h1 id="website-submit-title">Help Wadiya discover your website.</h1>
        <p>
          Website owners can submit a public website for automatic discovery and
          crawling. There is no manual approval queue.
        </p>
      </div>

      <form id="websiteSubmitForm" class="website-submit-form" novalidate>
        <label for="websiteUrl">Website URL</label>
        <div class="website-submit-row">
          <input
            id="websiteUrl"
            name="url"
            type="url"
            inputmode="url"
            maxlength="2048"
            autocomplete="url"
            placeholder="https://example.com"
            aria-describedby="websiteSubmitMessage"
            required
          >
          <button type="submit" id="websiteSubmitButton">Submit website</button>
        </div>
        <div
          id="websiteSubmitMessage"
          class="website-submit-message"
          role="status"
          aria-live="polite"
        ></div>
      </form>
    </section>

    <section id="discovery" aria-live="polite"></section>
  </main>

  <script src="/static/discovery.js"></script>
</body>
</html>
